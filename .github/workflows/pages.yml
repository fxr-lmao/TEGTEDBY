name: Déploiement GitHub Pages

on:
  push:
    # Le dépôt ayant été créé vide, la branche par défaut est celle de ce
    # travail. On couvre donc aussi les noms usuels : si vous renommez ou
    # fusionnez plus tard, la publication continue de se déclencher.
    branches:
      - main
      - master
      - claude/great-gauss-i2xyw0
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
